<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>CASEHUB | CS2 Case Opening</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -20%,
            #263b55,
            #0b1119 42%,
            #05070b
        );

    color:white;

    min-height:100vh;
}

button,
select{
    font:inherit;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{

    height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 38px;

    background:#080c12;

    border-bottom:
        1px solid #29384b;

    position:sticky;

    top:0;

    z-index:50;
}

.logo{

    font-size:28px;

    font-weight:900;

    letter-spacing:2px;
}

.logo span{

    color:#f5a623;
}

.navRight{

    display:flex;

    align-items:center;

    gap:12px;
}

.navButton,
.balance{

    padding:12px 17px;

    border-radius:8px;

    border:1px solid #35475e;

    background:#121c2a;

    color:white;

    font-weight:bold;
}

.navButton{

    cursor:pointer;

    transition:.2s;
}

.navButton:hover{

    background:#1c2b3d;
}

.balance span{

    color:#ffd166;
}


/* =====================================================
   PAGINAS
===================================================== */

.page{

    display:none;
}

.page.active{

    display:block;
}


/* =====================================================
   HOME
===================================================== */

.home{

    max-width:1250px;

    margin:auto;

    padding:
        45px 25px 100px;
}

.hero{

    text-align:center;

    margin-bottom:45px;
}

.hero h1{

    font-size:50px;

    font-weight:900;
}

.hero h1 span{

    color:#f5a623;
}

.hero p{

    color:#8998aa;

    margin-top:10px;

    font-size:16px;
}


/* =====================================================
   GRID DE CAJAS
===================================================== */

.casesGrid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(270px,1fr)
        );

    gap:22px;
}


/* =====================================================
   TARJETA DE CAJA
===================================================== */

.caseCard{

    background:
        linear-gradient(
            145deg,
            #142131,
            #0a1018
        );

    border:
        1px solid #30445c;

    border-radius:15px;

    padding:18px;

    cursor:pointer;

    transition:.25s;

    overflow:hidden;
}

.caseCard:hover{

    transform:
        translateY(-7px);

    border-color:#71849b;

    box-shadow:
        0 25px 60px #0008;
}

.caseImage{

    height:250px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle,
            #1c2b3d,
            #080d13
        );

    border-radius:10px;

    margin-bottom:17px;

    overflow:hidden;
}

.caseImage img{

    width:94%;

    height:230px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 25px 18px #000b
        );

    transition:.25s;
}

.caseCard:hover
.caseImage img{

    transform:
        scale(1.08);
}

.caseCard h2{

    font-size:21px;
}

.caseCard p{

    color:#8291a5;

    margin-top:8px;

    font-size:14px;

    line-height:1.5;
}

.price{

    display:inline-block;

    margin-top:17px;

    padding:9px 14px;

    border-radius:7px;

    background:#19283a;

    border:
        1px solid #3a4c62;

    color:#ffd166;

    font-weight:bold;
}


/* =====================================================
   PAGINA CAJA
===================================================== */

.casePage{

    max-width:1250px;

    margin:auto;

    padding:
        45px 25px 100px;
}

.backButton{

    padding:11px 18px;

    border-radius:8px;

    border:
        1px solid #35475e;

    background:#152131;

    color:white;

    cursor:pointer;

    margin-bottom:20px;
}

.backButton:hover{

    background:#1d2c3f;
}

.caseBox{

    padding:30px;

    border-radius:17px;

    border:
        1px solid #304258;

    background:
        linear-gradient(
            145deg,
            #152232,
            #0a1018
        );
}

.caseTop{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:30px;

    align-items:center;
}

.bigCase{

    min-height:330px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle,
            #1c2b3d,
            #080d13
        );

    border-radius:12px;

    overflow:hidden;
}

.bigCase img{

    width:92%;

    height:300px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 30px 30px #000b
        );
}

.caseInfo h1{

    font-size:42px;
}

.caseInfo p{

    color:#8392a5;

    line-height:1.6;

    margin:
        12px 0 25px;
}


/* =====================================================
   SELECTOR DE CANTIDAD
===================================================== */

.openPanel{

    background:#0b131d;

    border:
        1px solid #293b51;

    border-radius:12px;

    padding:18px;

    margin-top:20px;
}

.openPanelTitle{

    font-size:13px;

    color:#8998aa;

    margin-bottom:9px;
}

.quantitySelect{

    width:100%;

    padding:13px;

    border-radius:8px;

    background:#111d2b;

    color:white;

    border:
        1px solid #40546b;

    outline:none;

    cursor:pointer;

    margin-bottom:12px;
}

.quantitySelect:focus{

    border-color:#f5a623;
}

.openButton{

    width:100%;

    padding:17px;

    border:0;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #f5a623,
            #ffd166
        );

    color:#151515;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.openButton:hover{

    filter:
        brightness(1.1);

    transform:
        translateY(-1px);
}

.openButton:disabled{

    opacity:.5;

    cursor:not-allowed;
}

.costInfo{

    text-align:center;

    color:#8796a9;

    font-size:12px;

    margin-top:9px;
}

.costInfo strong{

    color:#ffd166;
}


/* =====================================================
   SKINS
===================================================== */

.skinsSection{

    margin-top:45px;
}

.skinsHeader p{

    margin-top:7px;

    color:#7f8da0;
}

.skinGrid{

    margin-top:20px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px,1fr)
        );

    gap:16px;
}

.skinCard{

    background:#0d151f;

    border:
        1px solid #2d4056;

    border-radius:11px;

    overflow:hidden;

    transition:.2s;
}

.skinCard:hover{

    transform:
        translateY(-4px);
}

.skinImage{

    height:175px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle,
            #1c2b3d,
            #080d13
        );

    border-bottom:3px solid;
}

.skinImage img{

    width:94%;

    max-height:155px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 15px 12px #000b
        );

    transition:.25s;
}

.skinCard:hover
.skinImage img{

    transform:
        scale(1.08);
}

.skinInfo{

    padding:14px;
}

.weaponName{

    color:#7d8da2;

    font-size:12px;
}

.skinName{

    margin-top:5px;

    font-weight:bold;

    font-size:16px;
}

.skinBottom{

    display:flex;

    justify-content:space-between;

    margin-top:13px;
}

.rarity{

    font-size:12px;

    font-weight:bold;
}

.probability{

    color:#9daabc;

    font-size:12px;
}


/* =====================================================
   INVENTARIO
===================================================== */

.inventoryPage{

    max-width:1200px;

    margin:auto;

    padding:
        45px 25px 100px;
}

.inventoryGrid{

    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px,1fr)
        );

    gap:16px;
}

.inventoryCard{

    background:#111a27;

    border:
        1px solid #2d4056;

    border-radius:10px;

    padding:15px;

    transition:.2s;
}

.inventoryCard:hover{

    transform:
        translateY(-4px);
}

.inventoryCard img{

    width:100%;

    height:130px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 15px 12px #000b
        );
}

.inventoryCard h3{

    margin-top:8px;

    font-size:15px;
}

.inventoryCard p{

    color:#8391a4;

    margin-top:5px;

    font-size:12px;
}


/* =====================================================
   OVERLAY APERTURA
===================================================== */

.overlay{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:#000f;

    backdrop-filter:
        blur(10px);

}

.overlay.show{

    display:flex;
}

.openingTitle{

    font-size:32px;

    font-weight:900;

    margin-bottom:25px;

    text-align:center;
}

.openingSubtitle{

    color:#8796a9;

    margin-top:-15px;

    margin-bottom:25px;
}

.loadingBox{

    width:
        min(500px,90vw);

    height:12px;

    background:#131d29;

    border-radius:20px;

    overflow:hidden;

    border:
        1px solid #30445c;
}

.loadingBar{

    width:0%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #f5a623,
            #ffe08a
        );

    transition:
        width 2.5s
        cubic-bezier(.2,.8,.2,1);
}


/* =====================================================
   RESULTADOS MÚLTIPLES
===================================================== */

.resultsBox{

    width:
        min(1050px,94vw);

    max-height:90vh;

    overflow:auto;

    padding:28px;

    border-radius:18px;

    border:
        1px solid #465c74;

    background:
        linear-gradient(
            145deg,
            #172536,
            #090f17
        );
}

.resultsHeader{

    text-align:center;

    margin-bottom:25px;
}

.resultsHeader h2{

    font-size:32px;
}

.resultsHeader p{

    color:#8493a6;

    margin-top:7px;
}

.resultsGrid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px,1fr)
        );

    gap:14px;
}

.resultCard{

    background:#0c141e;

    border:
        1px solid #30445c;

    border-radius:10px;

    overflow:hidden;

    animation:
        resultAppear
        .45s
        ease
        both;
}

@keyframes resultAppear{

    from{

        opacity:0;

        transform:
            scale(.8)
            translateY(20px);

    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateY(0);

    }

}

.resultCardImage{

    height:145px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle,
            #1b293a,
            #080d13
        );

    border-bottom:3px solid;
}

.resultCardImage img{

    width:95%;

    height:130px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 15px 12px #000b
        );
}

.resultInfo{

    padding:12px;
}

.resultInfo .weapon{

    font-size:11px;

    color:#7f8da0;
}

.resultInfo .skin{

    font-weight:bold;

    margin-top:5px;

    font-size:14px;
}

.resultInfo .rarity{

    display:block;

    margin-top:8px;
}

.closeResults{

    display:block;

    margin:
        25px auto 0;

    padding:
        13px 40px;

    border:0;

    border-radius:8px;

    background:#293a4f;

    color:white;

    cursor:pointer;

    font-weight:bold;
}

.closeResults:hover{

    background:#354b65;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:750px){

    .navbar{

        padding:0 15px;
    }

    .hero h1{

        font-size:38px;
    }

    .caseTop{

        grid-template-columns:1fr;
    }

    .caseInfo h1{

        font-size:31px;
    }

    .navButton{

        display:none;
    }

    .caseBox{

        padding:18px;
    }

}

</style>

</head>

/* =====================================================
   VARIABLES
===================================================== */

let coins = 2500;

let selectedCase = null;

let inventory = [];



/* =====================================================
   SKIN OBJECT
===================================================== */

function skinObject(s){

    return {

        weapon:s[0],

        name:s[1],

        rarity:s[2],

        chance:s[3],

        image:s[4]

    };

}



/* =====================================================
   COLOR RAREZA
===================================================== */

function rarityColor(rarity){

    if(
        rarity === "Mil-Spec"
    ){

        return "#4b8cff";

    }


    if(
        rarity === "Restricted"
    ){

        return "#9b59ff";

    }


    if(
        rarity === "Classified"
    ){

        return "#e85cff";

    }


    if(
        rarity === "Covert"
    ){

        return "#ff4b4b";

    }


    return "#ffd43b";

}



/* =====================================================
   MOSTRAR CAJAS
===================================================== */

function renderCases(){

    const grid =
    document.getElementById(
        "casesGrid"
    );


    grid.innerHTML = "";


    cases.forEach(
        (box,index)=>{


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "caseCard";


            card.onclick =
            function(){

                selectCase(index);

            };


            card.innerHTML = `

                <div class="caseImage">

                    <img
                        src="${box.image}"
                        alt="${box.name}">

                </div>


                <h2>

                    ${box.name}

                </h2>


                <p>

                    Caja de CS2 con
                    skins de diferentes
                    rarezas y objetos
                    especiales.

                </p>


                <div class="price">

                    💰 ${box.price}
                    coins

                </div>

            `;


            grid.appendChild(card);

        }
    );

}



/* =====================================================
   SELECCIONAR CAJA
===================================================== */

function selectCase(index){

    selectedCase =
    cases[index];


    document
        .getElementById("home")
        .classList
        .remove("active");


    document
        .getElementById("inventoryPage")
        .classList
        .remove("active");


    document
        .getElementById("casePage")
        .classList
        .add("active");


    document
        .getElementById("caseTitle")
        .textContent =
        selectedCase.name;


    document
        .getElementById("caseDescription")
        .textContent =
        "Elige cuántas cajas quieres abrir. ¡Mientras más abras, más skins recibirás!";


    document
        .getElementById("bigCase")
        .innerHTML = `

            <img
                src="${selectedCase.image}"
                alt="${selectedCase.name}">

        `;


    document
        .getElementById("quantity")
        .value = "1";


    renderSkins();

    updateOpenButton();

    window.scrollTo(0,0);

}



/* =====================================================
   MOSTRAR SKINS
===================================================== */

function renderSkins(){

    const grid =
    document.getElementById(
        "skinsGrid"
    );


    grid.innerHTML = "";


    selectedCase.skins
        .map(skinObject)
        .forEach(
            skin=>{


                const color =
                rarityColor(
                    skin.rarity
                );


                const card =
                document.createElement(
                    "div"
                );


                card.className =
                "skinCard";


                card.innerHTML = `

                    <div
                        class="skinImage"
                        style="
                        border-color:${color};
                        ">

                        <img
                            src="${skin.image}"
                            alt="${skin.name}">

                    </div>


                    <div class="skinInfo">


                        <div class="weaponName">

                            ${skin.weapon}

                        </div>


                        <div class="skinName">

                            ${skin.name}

                        </div>


                        <div class="skinBottom">


                            <span
                                class="rarity"
                                style="
                                color:${color};
                                ">

                                ${skin.rarity}

                            </span>


                            <span
                                class="probability">

                                ${skin.chance}%

                            </span>


                        </div>


                    </div>

                `;


                grid.appendChild(card);

            }
        );

}



/* =====================================================
   ACTUALIZAR BOTON
===================================================== */

function updateOpenButton(){

    if(!selectedCase){

        return;

    }


    const quantity =
    Number(
        document.getElementById(
            "quantity"
        ).value
    );


    const total =
    selectedCase.price *
    quantity;


    document
        .getElementById(
            "openButton"
        )
        .textContent =

        `🎁 ABRIR ${quantity} ${
            quantity === 1
            ? "CAJA"
            : "CAJAS"
        }`;


    document
        .getElementById(
            "totalCost"
        )
        .textContent =
        total.toLocaleString(
            "es-ES"
        );

}



/* =====================================================
   ELEGIR SKIN
===================================================== */

function chooseSkin(){

    let random =
    Math.random()*100;


    let total = 0;


    for(
        const raw
        of selectedCase.skins
    ){

        const skin =
        skinObject(raw);


        total +=
        skin.chance;


        if(
            random <= total
        ){

            return skin;

        }

    }


    return skinObject(
        selectedCase.skins[
            selectedCase.skins.length-1
        ]
    );

}



/* =====================================================
   ABRIR VARIAS CAJAS
===================================================== */

function openCases(){

    if(!selectedCase){

        return;

    }


    const quantity =
    Number(
        document.getElementById(
            "quantity"
        ).value
    );


    const totalCost =
    selectedCase.price *
    quantity;


    if(
        coins < totalCost
    ){

        alert(
            "❌ No tienes suficientes coins."
        );

        return;

    }


    /* RESTAR COINS */

    coins -=
    totalCost;


    updateCoins();


    /* DESACTIVAR */

    document
        .getElementById(
            "openButton"
        )
        .disabled = true;


    /* MOSTRAR CANTIDAD */

    document
        .getElementById(
            "openingAmount"
        )
        .textContent =
        quantity;


    const overlay =
    document.getElementById(
        "openingOverlay"
    );


    const loading =
    document.getElementById(
        "loadingBar"
    );


    loading.style.width =
    "0%";


    overlay.classList
        .add("show");


    setTimeout(
        ()=>{

            loading.style.width =
            "100%";

        },
        100
    );


    /* GENERAR RESULTADOS */

    const results = [];


    for(
        let i=0;
        i<quantity;
        i++
    ){

        const skin =
        chooseSkin();


        results.push(skin);

        inventory.push(skin);

    }


    /* MOSTRAR RESULTADOS */

    setTimeout(
        ()=>{

            overlay.classList
                .remove("show");


            showResults(
                results
            );


            document
                .getElementById(
                    "openButton"
                )
                .disabled = false;

        },
        2700
    );

}



/* =====================================================
   MOSTRAR RESULTADOS
===================================================== */

function showResults(results){

    const overlay =
    document.getElementById(
        "resultsOverlay"
    );


    const grid =
    document.getElementById(
        "resultsGrid"
    );


    grid.innerHTML = "";


    results.forEach(
        (skin,index)=>{


            const color =
            rarityColor(
                skin.rarity
            );


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "resultCard";


            card.style.animationDelay =
            `${index*0.08}s`;


            card.innerHTML = `

                <div
                    class="resultCardImage"
                    style="
                    border-color:${color};
                    ">


                    <img
                        src="${skin.image}"
                        alt="${skin.name}">


                </div>


                <div class="resultInfo">


                    <div class="weapon">

                        ${skin.weapon}

                    </div>


                    <div class="skin">

                        ${skin.name}

                    </div>


                    <span
                        class="rarity"
                        style="
                        color:${color};
                        ">

                        ${skin.rarity}

                    </span>


                    <div
                        style="
                        margin-top:6px;
                        color:#7f8da0;
                        font-size:11px;
                        ">

                        Probabilidad:
                        ${skin.chance}%

                    </div>


                </div>

            `;


            grid.appendChild(card);

        }
    );


    overlay.classList
        .add("show");

}



/* =====================================================
   CERRAR RESULTADOS
===================================================== */

function closeResults(){

    document
        .getElementById(
            "resultsOverlay"
        )
        .classList
        .remove("show");

}



/* =====================================================
   VOLVER AL HOME
===================================================== */

function goHome(){

    document
        .getElementById(
            "casePage"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "inventoryPage"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "home"
        )
        .classList
        .add("active");


    window.scrollTo(
        0,
        0
    );

}



/* =====================================================
   INVENTARIO
===================================================== */

function showInventory(){

    document
        .getElementById(
            "home"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "casePage"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "inventoryPage"
        )
        .classList
        .add("active");


    renderInventory();


    window.scrollTo(
        0,
        0
    );

}



/* =====================================================
   RENDER INVENTARIO
===================================================== */

function renderInventory(){

    const grid =
    document.getElementById(
        "inventoryGrid"
    );


    grid.innerHTML = "";


    if(
        inventory.length === 0
    ){

        grid.innerHTML = `

            <p
                style="
                color:#8190a3;
                ">

                Todavía no tienes skins.
                Abre una caja para conseguir una.

            </p>

        `;

        return;

    }


    inventory
        .slice()
        .reverse()
        .forEach(
            skin=>{


                const color =
                rarityColor(
                    skin.rarity
                );


                const card =
                document.createElement(
                    "div"
                );


                card.className =
                "inventoryCard";


                card.innerHTML = `

                    <img
                        src="${skin.image}"
                        alt="${skin.name}">


                    <h3>

                        ${skin.name}

                    </h3>


                    <p>

                        ${skin.weapon}

                    </p>


                    <p
                        style="
                        color:${color};
                        font-weight:bold;
                        ">

                        ${skin.rarity}

                    </p>


                `;


                grid.appendChild(card);

            }
        );

}



/* =====================================================
   ACTUALIZAR COINS
===================================================== */

function updateCoins(){

    document
        .getElementById(
            "coins"
        )
        .textContent =
        coins.toLocaleString(
            "es-ES"
        );

}



/* =====================================================
   INICIAR
===================================================== */

renderCases();

updateCoins();

</script>
