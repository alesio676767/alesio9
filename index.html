<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASEHUB — Case Opening</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -20%,#263b59 0%,#0c121c 42%,#05070b 100%);
}

button{
    font-family:inherit;
}

.navbar{
    height:72px;
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 35px;

    background:rgba(5,8,13,.96);
    border-bottom:1px solid #29384b;
    backdrop-filter:blur(10px);
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#f5a623;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:14px;
}

.coins{
    padding:11px 17px;
    border-radius:8px;

    background:#111b2a;
    border:1px solid #35465d;

    font-weight:bold;
}

.coins span{
    color:#ffd166;
}

.nav-btn{
    border:1px solid #35465d;
    background:#151f2e;
    color:white;

    padding:11px 16px;
    border-radius:8px;

    cursor:pointer;
    font-weight:bold;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ================= HOME ================= */

.home{
    max-width:1250px;
    margin:auto;
    padding:65px 25px 100px;
}

.hero{
    text-align:center;
    margin-bottom:55px;
}

.hero h1{
    font-size:54px;
    font-weight:900;
}

.hero h1 span{
    color:#f5a623;
}

.hero p{
    margin-top:12px;
    color:#8998ac;
}

.cases-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:22px;
}

.case-card{
    position:relative;
    overflow:hidden;

    padding:22px;

    border-radius:16px;
    border:1px solid #2c4057;

    background:
        linear-gradient(145deg,#172333,#0b1119);

    cursor:pointer;
    transition:.25s;
}

.case-card:hover{
    transform:translateY(-8px);
    border-color:#657991;
    box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.case-visual{
    height:210px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.case-visual svg{
    width:230px;
    height:180px;

    filter:drop-shadow(0 20px 18px rgba(0,0,0,.65));

    transition:.25s;
}

.case-card:hover .case-visual svg{
    transform:scale(1.08) rotate(-3deg);
}

.case-card h2{
    font-size:21px;
    margin-bottom:8px;
}

.case-card p{
    color:#8190a4;
    line-height:1.5;
    font-size:14px;
}

.case-price{
    display:inline-block;
    margin-top:18px;

    padding:9px 14px;

    border-radius:7px;
    border:1px solid #3a4c62;

    color:#ffd166;
    background:#1b293b;

    font-weight:bold;
}

/* ================= CASE PAGE ================= */

.case-page{
    max-width:1250px;
    margin:auto;
    padding:28px 25px 100px;
}

.back{
    padding:11px 18px;

    border-radius:8px;
    border:1px solid #34475e;

    background:#172333;
    color:white;

    cursor:pointer;
    margin-bottom:20px;
}

.case-header{
    padding:30px;

    border-radius:18px;
    border:1px solid #304258;

    background:
        linear-gradient(145deg,#172333,#0b111a);
}

.case-main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
    align-items:center;
}

.big-case{
    min-height:310px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.big-case svg{
    width:410px;
    max-width:100%;

    filter:drop-shadow(0 25px 30px rgba(0,0,0,.65));
}

.case-text h1{
    font-size:40px;
}

.case-text p{
    margin-top:10px;
    margin-bottom:22px;

    color:#8493a7;
    line-height:1.6;
}

.open-btn{
    width:100%;
    padding:17px;

    border:0;
    border-radius:9px;

    background:linear-gradient(135deg,#f5a623,#ffd166);

    color:#171717;
    font-weight:900;
    font-size:17px;

    cursor:pointer;
}

.open-btn:hover{
    filter:brightness(1.08);
    transform:translateY(-2px);
}

.open-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* ================= ODDS ================= */

.odds{
    margin-top:25px;
}

.odds h3{
    margin-bottom:15px;
}

.odds-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
}

.odds-name{
    width:110px;
    font-size:12px;
    font-weight:bold;
}

.odds-bar{
    flex:1;
    height:8px;
    overflow:hidden;

    background:#202b3a;
    border-radius:20px;
}

.odds-fill{
    height:100%;
    border-radius:20px;
}

.odds-number{
    width:60px;
    text-align:right;
    color:#9ba8b9;
    font-size:12px;
}

/* ================= SKINS ================= */

.skins{
    margin-top:42px;
}

.skins-title{
    margin-bottom:20px;
}

.skins-title h2{
    font-size:26px;
}

.skins-title p{
    color:#7f8da1;
    margin-top:7px;
}

.skin-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.skin{
    overflow:hidden;

    border-radius:10px;
    border:1px solid #2b3d53;

    background:#0d151f;

    transition:.2s;
}

.skin:hover{
    transform:translateY(-4px);
    border-color:#657a92;
}

.skin-picture{
    height:155px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle,#1b2a3d,#080d13);
}

.skin-picture svg{
    width:205px;
    height:120px;

    filter:drop-shadow(0 12px 13px rgba(0,0,0,.7));

    transition:.2s;
}

.skin:hover .skin-picture svg{
    transform:scale(1.07);
}

.skin-content{
    padding:14px;
}

.weapon{
    color:#7e8da2;
    font-size:12px;
}

.skin-name{
    margin-top:5px;
    font-weight:bold;
}

.skin-footer{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
}

.rarity{
    font-size:12px;
    font-weight:bold;
}

.chance{
    color:#a5b1c1;
    font-size:12px;
}

/* ================= ROULETTE ================= */

.roulette-overlay{
    position:fixed;
    inset:0;
    z-index:5000;

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.93);
    backdrop-filter:blur(9px);
}

.roulette-overlay.show{
    display:flex;
}

.roulette-title{
    font-size:28px;
    font-weight:900;
    margin-bottom:25px;
}

.roulette{
    position:relative;

    width:min(1100px,94vw);
    height:205px;

    overflow:hidden;

    border:1px solid #42566e;
    border-radius:12px;

    background:#070c12;
}

.roulette:after{
    content:"";

    position:absolute;
    left:50%;
    top:0;

    width:4px;
    height:100%;

    transform:translateX(-50%);

    background:#ffd166;

    box-shadow:0 0 20px #ffd166;

    z-index:10;
}

.roulette-track{
    display:flex;
    height:100%;

    transform:translateX(0);
}

.roulette-item{
    flex:0 0 180px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    border-right:1px solid #202c3c;
}

.roulette-item svg{
    width:145px;
    height:95px;
}

.roulette-item span{
    margin-top:4px;
    font-size:11px;
    font-weight:bold;
}

.roulette-status{
    margin-top:22px;
    color:#8998ab;
}

/* ================= RESULT ================= */

.result-overlay{
    position:fixed;
    inset:0;
    z-index:6000;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.9);
    backdrop-filter:blur(10px);
}

.result-overlay.show{
    display:flex;
}

.result{
    width:min(520px,92%);

    padding:35px;

    text-align:center;

    border-radius:18px;
    border:1px solid #455c75;

    background:
        linear-gradient(145deg,#172333,#0b111a);

    animation:resultIn .45s ease;
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:scale(.65);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.result img{
    display:none;
}

.result-weapon{
    width:100%;
    height:220px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.result-weapon svg{
    width:400px;
    max-width:100%;
    height:190px;

    filter:drop-shadow(0 20px 25px rgba(0,0,0,.8));
}

.result h2{
    font-size:30px;
}

.result p{
    margin-top:7px;
    color:#8796a9;
}

.continue{
    margin-top:25px;

    padding:13px 30px;

    border:0;
    border-radius:8px;

    background:#29394e;
    color:white;

    cursor:pointer;
    font-weight:bold;
}

/* ================= INVENTORY ================= */

.inventory-page{
    max-width:1200px;
    margin:auto;
    padding:45px 25px 100px;
}

.inventory-page h1{
    margin-bottom:30px;
}

.inventory-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:15px;
}

.inventory-card{
    padding:15px;

    border-radius:10px;
    border:1px solid #2d3f55;

    background:#111a27;
}

.inventory-card svg{
    width:100%;
    height:120px;
}

.inventory-card h3{
    margin-top:8px;
    font-size:14px;
}

.inventory-card p{
    margin-top:5px;
    color:#8291a5;
    font-size:12px;
}

/* ================= MOBILE ================= */

@media(max-width:750px){

    .navbar{
        padding:0 15px;
    }

    .nav-btn{
        display:none;
    }

    .hero h1{
        font-size:37px;
    }

    .case-main{
        grid-template-columns:1fr;
    }

    .case-text h1{
        font-size:30px;
    }

    .roulette-item{
        flex-basis:145px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        CASE<span>HUB</span>
    </div>

    <div class="nav-right">

        <button class="nav-btn" onclick="showInventory()">
            🎒 Inventario
        </button>

        <div class="coins">
            💰 <span id="coins">2500</span>
        </div>

    </div>

</nav>


<!-- HOME -->

<section id="home" class="page active">

    <div class="home">

        <div class="hero">

            <h1>
                ABRE TU <span>CAJA</span>
            </h1>

            <p>
                Elige una caja y descubre qué skin te toca.
            </p>

        </div>

        <div id="casesGrid" class="cases-grid"></div>

    </div>

</section>


<!-- CASE -->

<section id="casePage" class="page">

    <div class="case-page">

        <button class="back" onclick="goHome()">
            ← Volver a las cajas
        </button>

        <div class="case-header">

            <div class="case-main">

                <div class="big-case" id="bigCase"></div>

                <div class="case-text">

                    <h1 id="caseTitle"></h1>

                    <p id="caseDescription"></p>

                    <button
                        id="openButton"
                        class="open-btn"
                        onclick="openCase()">
                    </button>

                    <div class="odds">

                        <h3>
                            Probabilidades
                        </h3>

                        <div class="odds-row">
                            <span class="odds-name" style="color:#4b8cff">
                                Mil-Spec
                            </span>

                            <div class="odds-bar">
                                <div class="odds-fill"
                                     style="width:79.92%;background:#4b8cff">
                                </div>
                            </div>

                            <span class="odds-number">
                                79.92%
                            </span>
                        </div>

                        <div class="odds-row">
                            <span class="odds-name" style="color:#9b59ff">
                                Restricted
                            </span>

                            <div class="odds-bar">
                                <div class="odds-fill"
                                     style="width:15.98%;background:#9b59ff">
                                </div>
                            </div>

                            <span class="odds-number">
                                15.98%
                            </span>
                        </div>

                        <div class="odds-row">
                            <span class="odds-name" style="color:#e85cff">
                                Classified
                            </span>

                            <div class="odds-bar">
                                <div class="odds-fill"
                                     style="width:3.2%;background:#e85cff">
                                </div>
                            </div>

                            <span class="odds-number">
                                3.20%
                            </span>
                        </div>

                        <div class="odds-row">
                            <span class="odds-name" style="color:#ff4b4b">
                                Covert
                            </span>

                            <div class="odds-bar">
                                <div class="odds-fill"
                                     style="width:.64%;background:#ff4b4b">
                                </div>
                            </div>

                            <span class="odds-number">
                                0.64%
                            </span>
                        </div>

                        <div class="odds-row">
                            <span class="odds-name" style="color:#ffd43b">
                                ★ Special
                            </span>

                            <div class="odds-bar">
                                <div class="odds-fill"
                                     style="width:.26%;background:#ffd43b">
                                </div>
                            </div>

                            <span class="odds-number">
                                0.26%
                            </span>
                        </div>

                    </div>

                </div>

            </div>


            <div class="skins">

                <div class="skins-title">

                    <h2>
                        🔫 Skins disponibles
                    </h2>

                    <p>
                        Estas son las skins que pueden salir.
                    </p>

                </div>

                <div id="skinsGrid" class="skin-grid"></div>

            </div>

        </div>

    </div>

</section>


<!-- INVENTORY -->

<section id="inventoryPage" class="page">

    <div class="inventory-page">

        <button class="back" onclick="goHome()">
            ← Volver
        </button>

        <h1>
            🎒 Mi inventario
        </h1>

        <div id="inventoryGrid" class="inventory-grid"></div>

    </div>

</section>


<!-- ROULETTE -->

<div id="rouletteOverlay" class="roulette-overlay">

    <div class="roulette-title">
        ABRIENDO CAJA...
    </div>

    <div class="roulette">

        <div id="rouletteTrack"
             class="roulette-track">
        </div>

    </div>

    <div class="roulette-status">
        La suerte está echada...
    </div>

</div>


<!-- RESULT -->

<div id="resultOverlay" class="result-overlay">

    <div class="result">

        <div id="resultRarity"
             style="font-weight:900;font-size:18px">
        </div>

        <div id="resultWeapon"
             class="result-weapon">
        </div>

        <h2 id="resultName"></h2>

        <p id="resultWeaponName"></p>

        <button class="continue"
                onclick="closeResult()">
            CONTINUAR
        </button>

    </div>

</div>


<script>

/* ============================================================
   SISTEMA DE SPRITES
   Todo está dentro del HTML.
   No necesita imágenes externas.
============================================================ */


/* Escape XML */

function esc(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}


/* ============================================================
   GENERADOR DE ARMAS
============================================================ */

function weaponSVG(type, skin){

    let accent = "#4b8cff";

    if(skin === "purple") accent="#a855f7";
    if(skin === "pink") accent="#ec4899";
    if(skin === "red") accent="#ef4444";
    if(skin === "gold") accent="#facc15";
    if(skin === "cyan") accent="#22d3ee";

    let body="#171d26";
    let dark="#090d12";
    let metal="#687384";

    let shape="";

    if(type==="AK-47"){

        shape=`

        <path
            d="M45 72 L205 72
               L265 52 L420 52
               L447 67 L425 82
               L275 82 L240 96
               L165 101 L125 88
               L55 88 Z"
            fill="${body}"
            stroke="${metal}"
            stroke-width="3"/>

        <path
            d="M105 88 L155 93
               L130 145 L93 138 Z"
            fill="${dark}"/>

        <path
            d="M235 83 L280 86
               L310 145 L275 150 Z"
            fill="${dark}"/>

        <path
            d="M315 56 L380 56 L395 71
               L315 71 Z"
            fill="${accent}"/>

        <rect
            x="45" y="70"
            width="80"
            height="10"
            rx="4"
            fill="${accent}"/>

        <circle
            cx="425"
            cy="67"
            r="5"
            fill="${accent}"/>

        `;

    }


    else if(type==="AWP"){

        shape=`

        <path
            d="M30 78
               L145 78
               L195 68
               L460 68
               L475 78
               L460 89
               L195 89
               L150 100
               L65 100
               L35 91 Z"
            fill="${body}"
            stroke="${metal}"
            stroke-width="3"/>

        <path
            d="M120 91 L175 95
               L150 145 L110 140 Z"
            fill="${dark}"/>

        <rect
            x="190"
            y="52"
            width="145"
            height="15"
            rx="5"
            fill="${accent}"/>

        <rect
            x="360"
            y="55"
            width="110"
            height="8"
            fill="${metal}"/>

        <circle
            cx="225"
            cy="60"
            r="9"
            fill="${dark}"
            stroke="${accent}"
            stroke-width="3"/>

        `;

    }


    else if(type==="M4A1-S" || type==="M4A4"){

        shape=`

        <path
            d="M45 70
               L200 70
               L250 60
               L430 60
               L455 70
               L440 83
               L260 83
               L220 95
               L120 95
               L80 86
               L45 86 Z"
            fill="${body}"
            stroke="${metal}"
            stroke-width="3"/>

        <path
            d="M100 88
               L155 91
               L140 142
               L100 135 Z"
            fill="${dark}"/>

        <path
            d="M250 82
               L290 84
               L305 135
               L275 140 Z"
            fill="${dark}"/>

        <rect
            x="270"
            y="48"
            width="130"
            height="11"
            rx="4"
            fill="${accent}"/>

        <rect
            x="420"
            y="66"
            width="40"
            height="6"
            fill="${metal}"/>

        <circle
            cx="205"
            cy="75"
            r="7"
            fill="${accent}"/>

        `;

    }


    else if(type==="Glock-18" || type==="USP-S"){

        shape=`

        <path
            d="M75 62
               L270 62
               L305 74
               L305 90
               L220 90
               L210 110
               L125 110
               L90 93
               L75 75 Z"
            fill="${body}"
            stroke="${metal}"
            stroke-width="3"/>

        <path
            d="M130 90
               L190 90
               L180 150
               L135 145 Z"
            fill="${dark}"/>

        <rect
            x="75"
            y="62"
            width="155"
            height="10"
            rx="3"
            fill="${accent}"/>

        <rect
            x="275"
            y="72"
            width="50"
            height="6"
            fill="${metal}"/>

        <circle
            cx="115"
            cy="67"
            r="4"
            fill="${accent}"/>

        `;

    }


    else if(type==="MP9"){

        shape=`

        <path
            d="M55 70
               L245 70
               L290 60
               L410 60
               L430 72
               L420 87
               L285 87
               L245 96
               L125 96
               L80 88
               L55 82 Z"
            fill="${body}"
            stroke="${metal}"
            stroke-width="3"/>

        <path
            d="M125 90
               L170 92
               L160 140
               L125 136 Z"
            fill="${dark}"/>

        <rect
            x="100"
            y="58"
            width="100"
            height="10"
            fill="${accent}"/>

        <circle
            cx="275"
            cy="66"
            r="8"
            fill="${accent}"/>

        `;

    }


    else if(type==="★ Karambit"){

        shape=`

        <path
            d="M95 95
               C170 20 300 15 420 65
               C335 48 260 63 205 100
               C175 120 140 128 110 112 Z"
            fill="${accent}"
            stroke="#ffe89a"
            stroke-width="3"/>

        <path
            d="M85 90
               L140 108
               L120 145
               L70 125 Z"
            fill="${dark}"
            stroke="${metal}"
            stroke-width="3"/>

        <circle
            cx="100"
            cy="115"
            r="14"
            fill="none"
            stroke="${accent}"
            stroke-width="7"/>

        `;

    }


    else if(type==="★ Butterfly Knife"){

        shape=`

        <path
            d="M55 80
               L190 58
               L245 72
               L190 87
               Z"
            fill="${accent}"
            stroke="#ffe89a"
            stroke-width="3"/>

        <path
            d="M445 80
               L310 58
               L255 72
               L310 87
               Z"
            fill="${accent}"
            stroke="#ffe89a"
            stroke-width="3"/>

        <rect
            x="220"
            y="62"
            width="60"
            height="18"
            rx="6"
            fill="${dark}"
            stroke="${metal}"
            stroke-width="3"/>

        <circle
            cx="250"
            cy="71"
            r="5"
            fill="${accent}"/>

        `;

    }


    return `
    <svg
        viewBox="0 0 500 180"
        xmlns="http://www.w3.org/2000/svg">

        <defs>

            <linearGradient
                id="metal${Math.random()}"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop offset="0%" stop-color="#8b95a5"/>
                <stop offset="45%" stop-color="#313a48"/>
                <stop offset="100%" stop-color="#10151c"/>

            </linearGradient>

        </defs>

        ${shape}

        <text
            x="250"
            y="170"
            text-anchor="middle"
            fill="${accent}"
            opacity=".35"
            font-size="10"
            font-family="Arial">
            ${esc(skin || "CS2")}
        </text>

    </svg>
    `;
}


/* ============================================================
   GENERADOR DE CAJAS
============================================================ */

function caseSVG(accent="#f5a623",number="01"){

    <svg
        viewBox="0 0 500 350"
        xmlns="http://www.w3.org/2000/svg">

        <defs>

            <linearGradient
                id="boxGradient${number}"
                x1="0"
                y1="0"
                x2="1"

                <stop offset="45%" stop-color="#202a39"/>
                <stop offset="100%" stop-color="#080d13"/>

            </linearGradient>

        </defs>

        <path
            d="M75 105
               L375 75
               L435 120
               L135 155 Z"
            fill="#1d2837"
            stroke="${accent}"
            stroke-width="5"/>

        <path
            d="M75 105
               L135 155
               L135 275
               L75 225 Z"
            fill="#0c121b"
            stroke="${accent}"
            stroke-width="5"/>

        <path
            d="M135 155
               L435 120
               L435 245
               L135 275 Z"
            fill="url(#boxGradient${number})"
            stroke="${accent}"
            stroke-width="5"/>

        <rect
            x="185"
            y="170"
            width="160"
            height="55"
            rx="8"
            fill="#080d13"
            stroke="${accent}"
            stroke-width="3"/>

        <text
            x="265"
            y="204"
            text-anchor="middle"
            fill="${accent}"
            font-size="22"
            font-family="Arial"

        </text>

        <text

        </text>

        <circle
            cx="115"
            cy="130"
            r="12"
            fill="${accent}"/>

        <circle
            cx="410"
            cy="135"
            r="12"
            fill="${accent}"/>

    </svg>

    `;
}

/* ============================================================
   VARIABLES
============================================================ */

let coins=2500;
let selectedCase=null;
let inventory=[];


/* ============================================================
   ELEMENTOS
============================================================ */

const home=document.getElementById("home");
const casePage=document.getElementById("casePage");
const inventoryPage=document.getElementById("inventoryPage");

const casesGrid=document.getElementById("casesGrid");
const skinsGrid=document.getElementById("skinsGrid");

const coinsEl=document.getElementById("coins");


/* ============================================================
   RENDER CAJAS
============================================================ */

function renderCases(){

    casesGrid.innerHTML="";

    cases.forEach((box,index)=>{

        const card=document.createElement("div");

        card.className="case-card";

        card.onclick=()=>selectCase(index);

        card.innerHTML=`

            <div class="case-visual">

                ${caseSVG(
                    box.accent,
                    box.number
                )}

            </div>

            <h2>
                ${box.name}
            </h2>

            <p>
                ${box.description}
            </p>

            <div class="case-price">
                💰 ${box.price} coins
            </div>
        `;

        casesGrid.appendChild(card);

    });
}


/* ============================================================
   SELECCIONAR CAJA
============================================================ */

function selectCase(index){

    selectedCase=cases[index];

    home.classList.remove("active");
    inventoryPage.classList.remove("active");
    casePage.classList.add("active");

    document.getElementById("caseTitle")
        .textContent=selectedCase.name;

    document.getElementById("caseDescription")
        .textContent=selectedCase.description;

    document.getElementById("bigCase").innerHTML=
        caseSVG(
            selectedCase.accent,
            selectedCase.number
        );

    document.getElementById("openButton")
        .textContent=
        `ABRIR CAJA — ${selectedCase.price} COINS`;

    renderSkins();

    window.scrollTo(0,0);
}


/* ============================================================
   COLOR RAREZA
============================================================ */

function rarityColor(r){

    if(r==="Mil-Spec")
        return "#4b8cff";

    if(r==="Restricted")
        return "#9b59ff";

    if(r==="Classified")
        return "#e85cff";

    if(r==="Covert")
        return "#ff4b4b";

    return "#ffd43b";
}


/* ============================================================
   COLOR SKIN
============================================================ */

function skinAccent(code){

    const colors={
        blue:"#4b8cff",
        purple:"#a855f7",
        pink:"#ec4899",
        red:"#ef4444",
        gold:"#facc15",
        cyan:"#22d3ee"
    };

    return colors[code] || "#4b8cff";
}


/* ============================================================
   RENDER SKINS
============================================================ */

function renderSkins(){

    skinsGrid.innerHTML="";

    selectedCase.skins.forEach(skin=>{

        const weapon=skin[0];
        const name=skin[1];
        const rarity=skin[2];
        const chance=skin[3];
        const accent=skin[4];

        const card=document.createElement("div");

        card.className="skin";

        card.innerHTML=`

            <div
                class="skin-picture"
                style="
                box-shadow:inset 0 -3px 0 ${rarityColor(rarity)}
                ">

                ${weaponSVG(
                    weapon,
                    accent
                )}

            </div>

            <div class="skin-content">

                <div class="weapon">
                    ${weapon}
                </div>

                <div class="skin-name">
                    ${name}
                </div>

                <div class="skin-footer">

                    <span
                        class="rarity"
                        style="
                        color:${rarityColor(rarity)}
                        ">
                        ${rarity}
                    </span>

                    <span class="chance">
                        ${chance}%
                    </span>

                </div>

            </div>
        `;

        skinsGrid.appendChild(card);

    });
}


/* ============================================================
   VOLVER
============================================================ */

function goHome(){

    casePage.classList.remove("active");
    inventoryPage.classList.remove("active");
    home.classList.add("active");

    window.scrollTo(0,0);
}


/* ============================================================
   ABRIR CAJA
============================================================ */

function openCase(){

    if(!selectedCase)
        return;

    if(coins<selectedCase.price){

        alert("No tienes suficientes coins.");

        return;
    }

    coins-=selectedCase.price;

    updateCoins();

    const button=
        document.getElementById("openButton");

    button.disabled=true;
    button.textContent="ABRIENDO...";

    startRoulette();
}


/* ============================================================
   ELEGIR SKIN SEGÚN PROBABILIDAD
============================================================ */

function chooseSkin(){

    const random=Math.random()*100;

    let total=0;

    for(const skin of selectedCase.skins){

        total+=skin[3];

        if(random<=total)
            return skin;

    }

    return selectedCase.skins[0];
}


/* ============================================================
   ROULETTE
============================================================ */

function startRoulette(){

    const overlay=
        document.getElementById(
            "rouletteOverlay"
        );

    const track=
        document.getElementById(
            "rouletteTrack"
        );

    track.innerHTML="";

    track.style.transition="none";
    track.style.transform="translateX(0)";

    overlay.classList.add("show");

    const winner=chooseSkin();

    const items=[];

    for(let i=0;i<55;i++){

        const randomSkin=
            selectedCase.skins[
                Math.floor(
                    Math.random()*
                    selectedCase.skins.length
                )
            ];

        items.push(randomSkin);
    }

    const winnerIndex=48;

    items[winnerIndex]=winner;

    items.forEach(skin=>{

        const item=
            document.createElement("div");

        item.className="roulette-item";

        item.innerHTML=`

            ${weaponSVG(
                skin[0],
                skin[4]
            )}

            <span
                style="
                color:${rarityColor(skin[2])}">
                ${skin[1]}
            </span>
        `;

        track.appendChild(item);

    });


    setTimeout(()=>{

        const itemWidth=180;

        const container=
            document.querySelector(
                ".roulette"
            ).clientWidth;

        const center=
            container/2;

        const target=
            winnerIndex*itemWidth+
            itemWidth/2-
            center;

        const randomOffset=
            Math.floor(
                Math.random()*50
            )-25;

        track.style.transition=
            "transform 5s cubic-bezier(.08,.75,.1,1)";

        track.style.transform=
            `translateX(-${target-randomOffset}px)`;

    },100);


    setTimeout(()=>{

        overlay.classList.remove("show");

        showResult(winner);

        addInventory(winner);

        const button=
            document.getElementById(
                "openButton"
            );

        button.disabled=false;

        button.textContent=
            `ABRIR CAJA — ${selectedCase.price} COINS`;

    },5300);
}


/* ============================================================
   RESULTADO
============================================================ */

function showResult(skin){

    const overlay=
        document.getElementById(
            "resultOverlay"
        );

    const rarity=
        document.getElementById(
            "resultRarity"
        );

    rarity.textContent=skin[2];

    rarity.style.color=
        rarityColor(skin[2]);

    document.getElementById(
        "resultWeapon"
    ).innerHTML=
        weaponSVG(
            skin[0],
            skin[4]
        );

    document.getElementById(
        "resultName"
    ).textContent=skin[1];

    document.getElementById(
        "resultWeaponName"
    ).textContent=skin[0];

    overlay.classList.add("show");
}


/* ============================================================
   CERRAR RESULTADO
============================================================ */

function closeResult(){

    document
        .getElementById(
            "resultOverlay"
        )
        .classList.remove("show");
}


/* ============================================================
   INVENTARIO
============================================================ */

function addInventory(skin){

    inventory.push(skin);
}


function showInventory(){

    home.classList.remove("active");
    casePage.classList.remove("active");

    inventoryPage.classList.add("active");

    renderInventory();

    window.scrollTo(0,0);
}


function renderInventory(){

    const grid=
        document.getElementById(
            "inventoryGrid"
        );

    grid.innerHTML="";

    if(inventory.length===0){

        grid.innerHTML=`

            <p style="color:#7f8da1">
                Todavía no tienes skins.
                ¡Abre una caja!
            </p>

        `;

        return;
    }


    inventory.forEach(skin=>{

        const card=
            document.createElement("div");

        card.className="inventory-card";

        card.innerHTML=`

            ${weaponSVG(
                skin[0],
                skin[4]
            )}

            <h3>
                ${skin[1]}
            </h3>

            <p>
                ${skin[0]}
            </p>

            <p
                style="
                color:${rarityColor(skin[2])};
                font-weight:bold">

                ${skin[2]}

            </p>
        `;

        grid.appendChild(card);

    });
}


/* ============================================================
   COINS
============================================================ */

function updateCoins(){

    coinsEl.textContent=
        coins.toLocaleString();
}


/* ============================================================
   INICIAR
============================================================ */

renderCases();
updateCoins();

</script>
