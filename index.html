<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CASEHUB | CS2 Case Opening</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 50% -20%,
            #24364d,
            #0b1119 42%,
            #05070b
        );
    color:white;
    min-height:100vh;
}

button{
    font:inherit;
}

.navbar{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 38px;
    background:#080c12;
    border-bottom:1px solid #29384b;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#f5a623;
}

.navRight{
    display:flex;
    gap:14px;
    align-items:center;
}

.navButton,
.balance{
    padding:12px 17px;
    border-radius:8px;
    border:1px solid #35475e;
    background:#121c2a;
    color:white;
    font-weight:bold;
}

.navButton{
    cursor:pointer;
}

.balance span{
    color:#ffd166;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* =========================
   INICIO
========================= */

.home{
    max-width:1250px;
    margin:auto;
    padding:45px 25px 100px;
}

.hero{
    text-align:center;
    margin-bottom:45px;
}

.hero h1{
    font-size:50px;
}

.hero h1 span{
    color:#f5a623;
}

.hero p{
    color:#8998aa;
    margin-top:10px;
}

.casesGrid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(270px,1fr));
    gap:22px;
}

.caseCard{
    background:
        linear-gradient(
            145deg,
            #142131,
            #0a1018
        );

    border:1px solid #30445c;
    border-radius:15px;

    padding:18px;

    cursor:pointer;

    transition:.25s;

    overflow:hidden;
}

.caseCard:hover{
    transform:translateY(-7px);

    border-color:#71849b;

    box-shadow:
        0 25px 60px #0008;
}

.caseImage{
    height:250px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #1c2b3d,
            #080d13
        );

    border-radius:10px;

    margin-bottom:17px;

    overflow:hidden;
}

.caseImage img{
    width:94%;
    height:230px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 25px 18px #000b
        );

    transition:.25s;
}

.caseCard:hover
.caseImage img{
    transform:scale(1.08);
}

.caseCard h2{
    font-size:21px;
}

.caseCard p{
    color:#8291a5;

    margin-top:8px;

    font-size:14px;

    line-height:1.5;
}

.price{
    display:inline-block;

    margin-top:17px;

    padding:9px 14px;

    border-radius:7px;

    background:#19283a;

    border:1px solid #3a4c62;

    color:#ffd166;

    font-weight:bold;
}


/* =========================
   CAJA
========================= */

.casePage{
    max-width:1250px;

    margin:auto;

    padding:45px 25px 100px;
}

.backButton{
    padding:11px 18px;

    border-radius:8px;

    border:1px solid #35475e;

    background:#152131;

    color:white;

    cursor:pointer;

    margin-bottom:20px;
}

.caseBox{
    padding:30px;

    border-radius:17px;

    border:1px solid #304258;

    background:
        linear-gradient(
            145deg,
            #152232,
            #0a1018
        );
}

.caseTop{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:30px;

    align-items:center;
}

.bigCase{
    min-height:330px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle,
            #1c2b3d,
            #080d13
        );

    border-radius:12px;
}

.bigCase img{
    width:92%;

    height:300px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 30px 30px #000b
        );
}

.caseInfo h1{
    font-size:42px;
}

.caseInfo p{
    color:#8392a5;

    line-height:1.6;

    margin:12px 0 25px;
}

.openButton{
    width:100%;

    padding:17px;

    border:0;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #f5a623,
            #ffd166
        );

    color:#151515;

    font-weight:900;

    cursor:pointer;
}

.openButton:hover{
    filter:brightness(1.1);
}

.openButton:disabled{
    opacity:.5;

    cursor:not-allowed;
}


/* =========================
   SKINS
========================= */

.skinsSection{
    margin-top:45px;
}

.skinsHeader p{
    margin-top:7px;

    color:#7f8da0;
}

.skinGrid{
    margin-top:20px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px,1fr)
        );

    gap:16px;
}

.skinCard{
    background:#0d151f;

    border:1px solid #2d4056;

    border-radius:11px;

    overflow:hidden;

    transition:.2s;
}

.skinCard:hover{
    transform:translateY(-4px);
}

.skinImage{
    height:175px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle,
            #1c2b3d,
            #080d13
        );

    border-bottom:3px solid;
}

.skinImage img{
    width:94%;

    max-height:155px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 15px 12px #000b
        );

    transition:.25s;
}

.skinCard:hover
.skinImage img{
    transform:scale(1.08);
}

.skinInfo{
    padding:14px;
}

.weaponName{
    color:#7d8da2;

    font-size:12px;
}

.skinName{
    margin-top:5px;

    font-weight:bold;

    font-size:16px;
}

.skinBottom{
    display:flex;

    justify-content:space-between;

    margin-top:13px;
}

.rarity{
    font-size:12px;

    font-weight:bold;
}

.probability{
    color:#9daabc;

    font-size:12px;
}


/* =========================
   INVENTARIO
========================= */

.inventoryPage{
    max-width:1200px;

    margin:auto;

    padding:45px 25px 100px;
}

.inventoryGrid{
    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px,1fr)
        );

    gap:16px;
}

.inventoryCard{
    background:#111a27;

    border:1px solid #2d4056;

    border-radius:10px;

    padding:15px;
}

.inventoryCard img{
    width:100%;

    height:130px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 15px 12px #000b
        );
}

.inventoryCard h3{
    margin-top:8px;

    font-size:15px;
}

.inventoryCard p{
    color:#8391a4;

    margin-top:5px;

    font-size:12px;
}


/* =========================
   RULETA
========================= */

.overlay{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:#000f;

    backdrop-filter:blur(10px);
}

.overlay.show{
    display:flex;
}

.rouletteTitle{
    font-size:30px;

    font-weight:900;

    margin-bottom:25px;
}

.roulette{
    width:min(1100px,94vw);

    height:215px;

    overflow:hidden;

    position:relative;

    border:1px solid #40546c;

    border-radius:12px;

    background:#070b10;
}

.roulette::after{
    content:"";

    position:absolute;

    left:50%;

    top:0;

    width:4px;

    height:100%;

    transform:
        translateX(-50%);

    background:#ffd166;

    box-shadow:
        0 0 25px #ffd166;

    z-index:20;
}

.rouletteTrack{
    height:100%;

    display:flex;

    transform:
        translateX(0);
}

.rouletteItem{
    flex:0 0 180px;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    border-right:
        1px solid #202c3c;
}

.rouletteItem img{
    width:160px;

    height:115px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 10px 10px #000b
        );
}

.rouletteItem span{
    font-size:11px;

    font-weight:bold;
}


/* =========================
   RESULTADO
========================= */

.resultBox{
    width:min(550px,92vw);

    padding:35px;

    border-radius:18px;

    border:1px solid #465c74;

    background:
        linear-gradient(
            145deg,
            #172536,
            #090f17
        );

    text-align:center;
}

.resultImage{
    height:240px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.resultImage img{
    width:470px;

    max-width:100%;

    height:220px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 25px 20px #000c
        );
}

.resultBox h2{
    font-size:30px;
}

.resultWeapon{
    margin-top:8px;

    color:#8796a9;
}

.continue{
    margin-top:25px;

    padding:13px 35px;

    border:0;

    border-radius:8px;

    background:#293a4f;

    color:white;

    cursor:pointer;

    font-weight:bold;
}


/* =========================
   MOVIL
========================= */

@media(max-width:750px){

    .navbar{
        padding:0 15px;
    }

    .hero h1{
        font-size:38px;
    }

    .caseTop{
        grid-template-columns:1fr;
    }

    .caseInfo h1{
        font-size:31px;
    }

    .navButton{
        display:none;
    }

}

</style>
</head>

        </h2>

</div>


<script>

/* ==========================================

/* ==========================================

},


{

    skins:[

        [

        [

        ],

        [

/* ==========================================
   VARIABLES
========================================== */

let coins = 2500;

let selectedCase = null;

let inventory = [];


/* ==========================================
   CONVERTIR SKIN
========================================== */

function skinObject(s){

    return {

        weapon:s[0],

        name:s[1],

        rarity:s[2],

        chance:s[3],

        image:s[4]

    };

}


/* ==========================================
   COLOR DE RAREZA
========================================== */

function rarityColor(rarity){

    if(rarity === "Mil-Spec")
        return "#4b8cff";

    if(rarity === "Restricted")
        return "#9b59ff";

    if(rarity === "Classified")
        return "#e85cff";

    if(rarity === "Covert")
        return "#ff4b4b";

    return "#ffd43b";

}


/* ==========================================
   MOSTRAR CAJAS
========================================== */

function renderCases(){

    const grid =
    document.getElementById(
        "casesGrid"
    );

    grid.innerHTML = "";

    cases.forEach(
        (box,index)=>{

            const card =
            document.createElement(
                "div"
            );

            card.className =
            "caseCard";

            card.onclick =
            function(){

                selectCase(index);

            };

            card.innerHTML = `

                <div class="caseImage">

                    <img
                        src="${box.image}"
                        alt="${box.name}">

                </div>

                <h2>
                    ${box.name}
                </h2>

                <p>
                    Caja de CS2 con skins
                    de diferentes rarezas
                    y objetos especiales.
                </p>

                <div class="price">

                    💰 ${box.price} coins

                </div>

            `;

            grid.appendChild(card);

        }
    );

}


/* ==========================================
   SELECCIONAR CAJA
========================================== */

function selectCase(index){

    selectedCase =
    cases[index];

    document
    .getElementById("home")
    .classList
    .remove("active");

    document
    .getElementById("inventoryPage")
    .classList
    .remove("active");

    document
    .getElementById("casePage")
    .classList
    .add("active");


    document
    .getElementById("caseTitle")
    .textContent =
    selectedCase.name;


    document
    .getElementById("caseDescription")
    .textContent =
    "Abre esta caja para intentar conseguir una skin rara.";


    document
    .getElementById("bigCase")
    .innerHTML = `

        <img
            src="${selectedCase.image}"
            alt="${selectedCase.name}">

    `;


    document
    .getElementById("openButton")
    .textContent =
    `ABRIR CAJA — ${selectedCase.price} COINS`;


    renderSkins();

    window.scrollTo(0,0);

}


/* ==========================================
   MOSTRAR SKINS
========================================== */

function renderSkins(){

    const grid =
    document.getElementById(
        "skinsGrid"
    );

    grid.innerHTML = "";


    selectedCase.skins
    .map(skinObject)
    .forEach(
        skin=>{

            const color =
            rarityColor(
                skin.rarity
            );


            const card =
            document.createElement(
                "div"
            );

            card.className =
            "skinCard";


            card.innerHTML = `

                <div
                    class="skinImage"
                    style="
                    border-color:${color};
                    ">

                    <img
                        src="${skin.image}"
                        alt="${skin.weapon} | ${skin.name}">

                </div>


                <div class="skinInfo">

                    <div class="weaponName">

                        ${skin.weapon}

                    </div>


                    <div class="skinName">

                        ${skin.name}

                    </div>


                    <div class="skinBottom">

                        <span
                            class="rarity"
                            style="
                            color:${color};
                            ">

                            ${skin.rarity}

                        </span>


                        <span class="probability">

                            ${skin.chance}%

                        </span>

                    </div>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


/* ==========================================
   VOLVER
========================================== */

function goHome(){

    document
    .getElementById("casePage")
    .classList
    .remove("active");

    document
    .getElementById("inventoryPage")
    .classList
    .remove("active");

    document
    .getElementById("home")
    .classList
    .add("active");

    window.scrollTo(0,0);

}


/* ==========================================
   ELEGIR SKIN
========================================== */

function chooseSkin(){

    let random =
    Math.random()*100;

    let total = 0;


    for(
        const raw
        of selectedCase.skins
    ){

        const skin =
        skinObject(raw);

        total +=
        skin.chance;


        if(random <= total){

            return skin;

        }

    }


    return skinObject(
        selectedCase.skins[
            selectedCase.skins.length-1
        ]
    );

}


/* ==========================================
   ABRIR CAJA
========================================== */

function openCase(){

    if(
        coins <
        selectedCase.price
    ){

        alert(
            "No tienes suficientes coins."
        );

        return;

    }


    coins -=
    selectedCase.price;


    updateCoins();


    document
    .getElementById("openButton")
    .disabled = true;


    startRoulette();

}


/* ==========================================
   RULETA
========================================== */

function startRoulette(){

    const overlay =
    document.getElementById(
        "rouletteOverlay"
    );


    const track =
    document.getElementById(
        "rouletteTrack"
    );


    track.innerHTML = "";

    track.style.transition =
    "none";

    track.style.transform =
    "translateX(0)";


    overlay.classList
    .add("show");


    const winner =
    chooseSkin();


    const items = [];


    for(
        let i=0;
        i<60;
        i++
    ){

        items.push(
            chooseSkin()
        );

    }


    const winnerIndex = 52;


    items[winnerIndex] =
    winner;


    items.forEach(
        skin=>{

            const item =
            document.createElement(
                "div"
            );

            item.className =
            "rouletteItem";


            item.innerHTML = `

                <img
                    src="${skin.image}">

                <span
                    style="
                    color:${rarityColor(
                        skin.rarity
                    )}">

                    ${skin.name}

                </span>

            `;


            track.appendChild(item);

        }
    );


    setTimeout(
        ()=>{

            const width = 180;

            const center =
            document
            .querySelector(".roulette")
            .clientWidth/2;


            const target =
            winnerIndex*width+
            width/2-
            center;


            track.style.transition =
            "transform 5s cubic-bezier(.08,.75,.1,1)";


            track.style.transform =
            `translateX(-${target}px)`;

        },
        100
    );


    setTimeout(
        ()=>{

            overlay.classList
            .remove("show");


            inventory.push(
                winner
            );


            showResult(
                winner
            );


            document
            .getElementById(
                "openButton"
            )
            .disabled = false;

        },
        5350
    );

}


/* ==========================================
   RESULTADO
========================================== */

function showResult(skin){

    const overlay =
    document.getElementById(
        "resultOverlay"
    );


    const rarity =
    document.getElementById(
        "resultRarity"
    );


    rarity.textContent =
    skin.rarity;


    rarity.style.color =
    rarityColor(
        skin.rarity
    );


    document
    .getElementById(
        "resultImage"
    )
    .innerHTML = `

        <img
            src="${skin.image}"
            alt="${skin.name}">

    `;


    document
    .getElementById(
        "resultName"
    )
    .textContent =
    skin.name;


    document
    .getElementById(
        "resultWeapon"
    )
    .textContent =
    skin.weapon;


    overlay.classList
    .add("show");

}


/* ==========================================
   CERRAR RESULTADO
========================================== */

function closeResult(){

    document
    .getElementById(
        "resultOverlay"
    )
    .classList
    .remove("show");

}


/* ==========================================
   INVENTARIO
========================================== */

function showInventory(){

    document
    .getElementById("home")
    .classList
    .remove("active");


    document
    .getElementById("casePage")
    .classList
    .remove("active");


    document
    .getElementById("inventoryPage")
    .classList
    .add("active");


    renderInventory();

    window.scrollTo(0,0);

}


function renderInventory(){

    const grid =
    document.getElementById(
        "inventoryGrid"
    );


    grid.innerHTML = "";


    if(
        inventory.length === 0
    ){

        grid.innerHTML = `

            <p
                style="
                color:#8190a3">

                Todavía no tienes skins.
                Abre una caja para conseguir una.

            </p>

        `;

        return;

    }


    inventory.forEach(
        skin=>{

            const card =
            document.createElement(
                "div"
            );


            card.className =
            "inventoryCard";


            card.innerHTML = `

                <img
                    src="${skin.image}">

                <h3>
                    ${skin.name}
                </h3>

                <p>
                    ${skin.weapon}
                </p>

                <p
                    style="
                    color:${rarityColor(
                        skin.rarity
                    )};
                    font-weight:bold">

                    ${skin.rarity}

                </p>

            `;


            grid.appendChild(card);

        }
    );

}


/* ==========================================
   COINS
========================================== */

function updateCoins(){

    document
    .getElementById("coins")
    .textContent =
    coins.toLocaleString("es-ES");

}


/* ==========================================
   INICIAR
========================================== */

renderCases();

updateCoins();

</script>

</html>
