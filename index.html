/* =========================================================
   FALLBACK
   ========================================================= */

function skinImage(skin){

    if(skin.image)
        return skin.image;

    return "https://cs2.sh/image/C0x6zwlC-fAu6Oob";

}


/* =========================================================
   CORREGIR TODAS LAS IMÁGENES
   ========================================================= */

function renderSkinImage(skin){

    return `
        <img
            src="${skinImage(skin)}"
            alt="${skin.weapon} ${skin.name}"
            loading="lazy"
            onerror="
                this.onerror=null;
                this.src='https://cs2.sh/image/C0x6zwlC-fAu6Oob';
            "
        >
    `;

}
